# 4SYNC ARCH — test matrix (MP#71)
#
# WHY THIS FILE EXISTS. Every portability fix in this codebase was written on
# Windows, so the POSIX half of each one shipped unexercised. That is not
# hypothetical: g5's date-origin check opened a lowercased path, which succeeds
# on a case-insensitive filesystem and raises on every other one. The shipped
# manifest is named `4SYNC.yaml`, so on Linux and macOS the feature was inert —
# and it shipped that way through v1.0.7 and v1.0.8 behind a suite that already
# contained the two failing tests. Nothing ran them. (MP#70.)
#
# NO pip install. The product's standing claim is Python 3.8+, standard library
# only, no dependencies ever — so the suite runs under `unittest`, exactly the
# way an adopter runs it. A CI job that needs pip to test a zero-dependency
# product is testing something the adopter does not have.
#
# PyYAML IS ABSENT ON PURPOSE in the main matrix. It is absent from every fresh
# Python, which the codebase itself calls "the modal fresh install" — so absent
# is the DEFAULT adopter configuration and the one that must be covered widest.
# The `variants` job below covers the present case, which is the minority.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      # NEVER fail-fast. The entire point is seeing WHICH platforms break; a
      # cancelled matrix hides exactly the comparison this exists to provide.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.8', '3.11', '3.13']
        exclude:
          # NO macOS × 3.8 LEG EXISTS ANY MORE, and this is a statement about
          # GitHub rather than about us. `setup-python` has no 3.8 build for the
          # arm64 runners (macos-latest and every macos-14/15), and the x86 image
          # that did — `macos-13` — has been retired. A job requesting a retired
          # label is not rejected: it sits QUEUED until the 24-hour timeout and
          # then fails, so the run never concludes and the badge never goes green.
          #
          # Learned the expensive way on the first run this workflow ever had
          # (2026-08-11): 11 of 12 jobs green in under a minute, and the twelfth —
          # `macos-13 · py3.8` — never got a runner. The run-level status reads
          # "queued" while ANY job is unclaimed, so a fully-passing matrix looked
          # like a stall.
          #
          # WHAT THIS COSTS, said plainly rather than papered over: the 3.8 floor
          # is no longer exercised on macOS anywhere. It is still covered on Linux
          # and Windows, and macOS is still covered at 3.11 and 3.13 — so both
          # variables are tested, just not that one combination. If a 3.8-only
          # macOS bug ever exists, this matrix will not find it.
          - os: macos-latest
            python: '3.8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Confirm PyYAML is absent (the modal adopter)
        shell: bash
        run: |
          if python -c "import yaml" 2>/dev/null; then
            echo "PyYAML is present — this leg is meant to run without it."
            exit 1
          fi
          echo "PyYAML absent, as intended."

      - name: hooks
        run: python -m unittest discover -s hooks -p 'test_*.py' -v

      - name: scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  variants:
    # One OS, one Python, the two axes the main matrix deliberately holds fixed.
    name: ubuntu · py3.13 · ${{ matrix.leg }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        leg: [with-pyyaml, renamed-manifest, symlinked-tmpdir]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install PyYAML
        if: matrix.leg == 'with-pyyaml'
        run: python -m pip install --quiet pyyaml

      # MP#20 tells adopters to rename the manifest off the colliding default,
      # which sets ARCH_MANIFEST — and doing so once broke every adopter's suite,
      # with no way to tell those failures from real ones. The fixtures pin the
      # variable themselves now; this leg is what keeps that true.
      - name: Rename the manifest axis
        if: matrix.leg == 'renamed-manifest'
        run: echo "ARCH_MANIFEST=PROJECT.yaml" >> "$GITHUB_ENV"

      # A SYMLINKED TEMP DIRECTORY, which is macOS's normal state: /var is a
      # symlink to /private/var, so tempfile.mkdtemp() returns an uncanonicalised
      # path while `git rev-parse --show-toplevel` returns the real one. Three
      # tests compared the two and failed on every macOS box while passing here
      # and on Windows — found by an adopter, not by us (MP#78).
      #
      # WHY THIS LEG EXISTS WHEN THE MATRIX ALREADY HAS macOS: it is not knowable
      # from here whether GitHub's macOS runners set TMPDIR to a symlinked path,
      # and "the macOS leg will probably catch it" is a hope rather than a check.
      # This reproduces the mechanism deterministically, on the cheapest runner.
      - name: Symlinked TMPDIR
        if: matrix.leg == 'symlinked-tmpdir'
        run: |
          mkdir -p "$RUNNER_TEMP/realtmp"
          ln -s "$RUNNER_TEMP/realtmp" "$RUNNER_TEMP/symtmp"
          echo "TMPDIR=$RUNNER_TEMP/symtmp" >> "$GITHUB_ENV"

      - name: hooks
        run: python -m unittest discover -s hooks -p 'test_*.py' -v

      - name: scripts
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
