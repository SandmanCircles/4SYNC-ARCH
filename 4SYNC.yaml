# ═══════════════════════════════════════════════════════════════════════════
# 4SYNC.yaml — instance manifest. PURE DECLARATION: no state, no narrative.
# Any session bookends itself from this file, no skills required:
#   boot  → read this file, then load `boot:` in order
#   close → on an EXPLICIT ending signal from the user, run `close:` in order
#           (silence/idle/pause is NEVER a signal; for an UNATTENDED run,
#            finishing its declared task IS the signal)
# First session in a fresh drop-in: see `bootstrap:` (genesis).
# Write mode: edit ONLY when this instance's shape changes. The real cap is the
# max_bytes this file declares for itself under integrity.manifest_rules, and g5
# enforces it on every write — do not restate the number here, where it can drift
# from the one actually enforced. It already did.
# NO CALENDAR DATES ANYWHERE IN THIS FILE — `declaration_only` forbids them and
# g5 enforces it on every write, so one dated comment write-LOCKS the manifest
# for everybody afterwards. Dated history belongs in the ledger.
# ═══════════════════════════════════════════════════════════════════════════

sync_version: "1.0"

instance:
  name: "[SET AT GENESIS — project name]"
  # Canonical state root — ABSOLUTE path, set at genesis. Every close target
  # resolves from here regardless of session cwd (subfolder, worktree, mount).
  root: "[SET AT GENESIS — absolute path of this folder]"

boot:
  # Ordered, read whole in a single pass. Verify each loader YAML ends with
  # its `# ═══ EOF <filename> ═══` sentinel as the last received line; a
  # missing sentinel = clipped read → discard and re-read host-side.
  # IDENTITY BEFORE STATE BEFORE LEDGER. The ledger moved from first to last:
  # KERNEL declares itself FIRST ACTION, so loading the task ledger ahead of it
  # meant every session met the journal before the contract — the ledger is also
  # the biggest and most volatile file in the stack.
  # (A prompt-cache argument for the same order is on record and UNVERIFIED.
  #  That is not why this changed; do not cite it as settled.)
  - config/KERNEL.yaml       # identity contract — if meta.status: TEMPLATE → bootstrap
  - config/STATUS.yaml       # live state (overwrite-mode snapshot)
  - config/CANON_INDEX.yaml  # map of where deeper detail lives
  - MERGE_PLAN.md            # operational state: task ledger + session journal

on_demand:
  - config/REFERENCE.yaml    # deep canon — pull subtrees via CANON_INDEX, never at boot
  - NAMING_CONVENTIONS.md    # load before producing any external-facing output
  - FINDINGS.md              # durable findings; grep `Trigger:`, never read whole
  - LEDGER_GUIDE.md          # why each ledger rule exists; the rules themselves boot

never_load_whole:
  - config/HISTORY.md        # frozen archive

session_debt:              # unwrapped-session tracker: hook sets on mutation; only explicit close clears
  file: .session_debt.tsv  # local/gitignored; row: session_id started last cwd status
  live_within: 15m         # newer last_activity = a session working NOW, not debt
  at_boot: report_rows     # two readings: within live_within → "N other session(s) LIVE,
                           # ledgers contested"; older → "holding undeposited state"
  at_close: clear_own_row  # delete $CLAUDE_CODE_SESSION_ID's row

agents:                    # OPTIONAL — omit if one surface; the bulletin stays inert
  self: [declared, env:ARCH_AGENT, shell, ask]   # identity ladder, first hit wins
  roster: ABBA.md          # names + aliases live with the board they serve

bootstrap:
  # Genesis — fires ONLY when config/KERNEL.yaml has `meta.status: TEMPLATE`
  # (a fresh drop-in). Never fires again after the markers flip.
  seed:
    file: SEED.md
    flag: frontmatter status   # TEMPLATE = unfilled · AUTHORED = ready
  authored_seed:               # the single genesis pipeline: seed → stack.
                               # Steps run IN ORDER — the sequence is binding.
                               # All dates from the system clock, never memory.
    - CONFIRM WITH THE USER FIRST — WRITE NOTHING UNTIL THEY SAY GO. Read the
      seed and play back what you understood — project name, one-line purpose,
      agents/surfaces, naming rules, and anything RETIRED. Show instance.root on
      its OWN line, the full absolute path, labelled as the project's permanent
      home, and say plainly that every close resolves from it and that moving the
      folder later means repairing that path and the hook paths by hand. A user
      who cloned into Downloads or Desktop should flinch when they read it back —
      that flinch is the point, and it is the last moment it costs nothing.
      Ask them to confirm or correct it, and WAIT for an explicit yes.
      Both entry paths land here, so this is the only gate needed. Why it is worth
      one question — the steps below author the whole stack, set a root path, flip
      TEMPLATE markers, make the seed READ-ONLY and delete this block, so a misread
      seed is cheap to catch now and has to be unpicked by hand later
    - author config/KERNEL.yaml + STATUS.yaml + CANON_INDEX.yaml from the seed
      (fill bracketed placeholders; keep the skeleton's structure + directives;
      remove the TEMPLATE GUARD directive line); route the seed's deep canon
      (charter prose, rationale, origin history) into config/REFERENCE.yaml
    - fill CLAUDE.md and NAMING_CONVENTIONS.md placeholders
    - set instance.name + instance.root (absolute) in THIS file
    - route the seed's "Agents & surfaces" answer into ABBA.md's roster + declare
      an `agents` block here; if none named, omit it (ABBA/LANDING_QUEUE stay, inert)
    - flip meta.status TEMPLATE → AUTHORITATIVE in each authored file
    - verify every authored YAML: [eof_sentinel, yaml_parse]
    - archive the seed verbatim → archive/SEED_<date>.md, then set the archived
      file READ-ONLY (attrib +R / chmod a-w — the birth record is preserved,
      never edited) + CANON_INDEX pointer row
    - add the archived seed to CLAUDE.md's load list, on-demand only —
      "the genesis birth record, read-only"
    - PREFIX THE STACK — derive <P> from instance.name (uppercase, keep A-Z0-9 only,
      so "Acme Robotics" becomes ACMEROBOTICS), then rename every config/ stack file
      to config/<P>_<NAME> and THIS file to <P>.yaml. Two instances on one machine
      then share no stack filename, so a wrong-instance read is visible in the tool
      call and the log instead of looking identical to a right one. Update EVERY
      reference in the same pass — the boot, on_demand and never_load_whole lists
      here, the CANON_INDEX pointer rows, CLAUDE.md's load list, README. Then merge
      ARCH_MANIFEST=<P>.yaml into .claude/settings.json's env block (merge into it,
      never overwrite the file). WITHOUT that variable the rename silently DOWNGRADES
      the hardening — g5 stops guarding the manifest, the boot receipt and meter can
      no longer find it, and rotate falls back to a default journal cap instead of the
      declared one. Re-run the YAML verify afterwards. NOT renamed — CLAUDE.md, which
      Claude Code finds by exact name, and the root documents. This is provenance for
      the identity stack, not a project-wide rename
    - CLEAR THE PACKAGING OUT OF ROOT — move README.md, EXAMPLE.md, LICENSE,
      SUPPORT.md and RELEASE_NOTES.md to archive/ as ARCH_README.md,
      ARCH_EXAMPLE.md, ARCH_LICENSE.md, ARCH_SUPPORT.md, ARCH_RELEASE_NOTES.md.
      That is the PRODUCT's packaging, not this project's, and at
      root LICENSE is what GitHub reads as the new repo's own license the moment the
      user runs git init — their work would appear FSL-licensed under someone else's
      copyright. Keep all five
      TRACKED and never ignore archive/, since the license must travel with the code
      it covers and the archived seed is the birth record. .gitignore STAYS at root
    - RECORD THE BUILD THIS INSTANCE WAS BORN WITH — run
      `python scripts/arch_build.py --write-birth-record`. Writes archive/ARCH_BUILD.txt
      ONCE and refuses to overwrite — it holds the only claim in the instance that
      cannot be recomputed later. The build you are RUNNING is always computed live
      from the machinery on disk, so it is never transcribed and cannot go stale
    - prepend a genesis journal block to MERGE_PLAN.md
    - LAST — delete this `bootstrap` block; genesis cannot re-run once the TEMPLATE
      markers flip, so it is dead weight every later session reads
    - then continue with normal boot
  template_seed:               # interview mode — seed still says TEMPLATE
    - walk the user conversationally through SEED.md's own sections
    - write their answers INTO SEED.md; flip its status → AUTHORED
    - then run authored_seed (one pipeline; the seed is always the birth record)
  no_seed:
    - ask the user what this project is — NEVER invent an identity

close:
  freshness_check:           # MANDATORY gate before ANY ledger write below
    fresh_read: true         # re-read each target from ground truth immediately
                             # before editing it — the session-start copy is a
                             # STALE BASE; another session may have written since
    verify: [eof_sentinel, yaml_parse]   # parse check applies to YAML targets
    on_stale_or_clipped: abort_and_reread_host_side  # never write onto a bad read
    edit_mode: anchored_only # small anchored edits onto the fresh content;
                             # never a whole-file rewrite from a snapshot
    post_write: reread_and_diff_untouched  # AFTER each write: re-read + diff the regions the
                             # edit did NOT target vs the pre-write read; a changed untouched
                             # region = a concurrent-session clobber → restore it, don't ship it
  naming_check:              # QA gate — fires only if this session produced external-facing copy
    trigger: external_facing_output_produced_this_session
    against: NAMING_CONVENTIONS.md   # spot-check produced copy vs identity_quickref (loads on-demand)
    mode: spot_check         # a declared review step, not a hard block
  journal:
    file: MERGE_PLAN.md
    section: "## Session journal (recent)"
    mode: prepend_one_block  # this session's block already on top? edit it
    keep: 5                  # COUNT cap — a block can run KBs; can't bound size
    max_bytes: 16384         # SIZE cap; rotate.py reports over-cap, never blocks
    overflow_to: JOURNAL_HISTORY.md
  tasks:
    dir: tasks               # long form: tasks/MP-0NN.md, path derived from row id
    closed_dir: tasks/closed
    on_missing_open_doc: fail
  ledger_sync:
    file: MERGE_PLAN.md      # flip touched rows only; never delete, never renumber
  snapshot:
    file: config/STATUS.yaml
    mode: overwrite_facts    # never append; last_touched = ONE line
    skip_if: unattended_run  # an autonomous run must not rewrite the project's focus
    verify: [eof_sentinel, yaml_parse]
  bulletin:
    file: ABBA.md
    check_at_boot: true      # OPEN messages `To:` this agent, before planned work
    mode: scan_headers       # grep `### [n] … To: … Status:`; read ONLY your own bodies.
                             # On a header-count mismatch, full read AND SAY SO
    archive_done_after_days: 10
  debt: clear_own_row        # see session_debt: — delete this session's row
  rotate:
    script: scripts/rotate.py  # run if present AND runnable (no Python → skip silently);
                               # dry-run on first-ever use
  meter:
    script: scripts/meter.py   # boot-cost meter — never blocks
    args: --log                # append one row to metrics/roc_series.jsonl; --note is optional
    on_missing: skip           # a measurement never blocks a close
    # Drop `args` and it only reports. Keep it and the series starts on day one —
    # which is the only day it can start: a run not logged cannot be backfilled.
  actuals:
    script: scripts/actuals.py # MEASURED session cost — never blocks
    args: --log                # one row per session → metrics/actuals_series.jsonl
    on_missing: skip           # a measurement never blocks a close
    # The companion to meter:, not a substitute. meter reads FILE SIZES and says
    # what boot SHOULD cost, per file, before a session runs. This reads Claude
    # Code's own transcripts and says what sessions DID cost — measured, but
    # blind to which file, because the API sees one undifferentiated prefix.
    # Report both, labelled; never merge an estimate with a measurement.
    # Idempotent on (project, session), so a missed close self-heals — bounded
    # by transcript retention (cleanupPeriodDays), not by close discipline.
    # Reads usage integers ONLY, never message content: transcripts hold the
    # full verbatim conversation including tool results.
  commit:
    trusted_git: explicit_paths          # stage by path, no `add -A`; push only on request
    untrusted_or_no_git: LANDING_QUEUE.md  # queue a row; NEVER commit through a mount

integrity:
  eof_sentinel: "# ═══ EOF <filename> ═══"
  hooks:                                 # ARCH_HOOKS_MODE: warn | enforce | off
    - hooks/pre_tool_use.py              # PreToolUse — six structural guards + debt recorder
    - hooks/session_start.py             # SessionStart — boot receipt; ARCH_BOOT_MODE: announce | inject | off
  manifest_rules:            # enforced by g5 boring-guard (hooks/pre_tool_use.py)
    max_bytes: 16384         # raised 8192 → 10240 → 12288 → 16384, each time in the
                             # SAME edit that hit it, which is what g5's own message
                             # prescribes. A cap you raise on reflex is not a cap: every
                             # raise bought new CAPABILITY (declarations, the genesis
                             # prefix step, then meter/actuals), never narrative.
                             # Narrative gets cut instead. The 16384 step is different
                             # and is recorded as such: the file had ALREADY passed 12288
                             # unnoticed, so this raise buys nothing — it aligns the two
                             # repos on one number. What made the overrun invisible is
                             # the real lesson: g5 measures a write, so nothing was
                             # watching the file at rest. rotate.py's status pass now is.
    declaration_only: true   # no state, no narrative, no timestamps-as-journal

# ═══ EOF 4SYNC.yaml ═══
